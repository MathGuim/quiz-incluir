[project]
name = "quiz-shared"
version = "0.1.0"
description = "Shared enums and read-schemas for the quiz backend and frontend"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["quiz_shared"]
